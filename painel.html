<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Área da Cozinha</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="manifest" href="manifest-painel.json" />
<meta name="theme-color" content="#fe8f4d" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Painel Refeitório" />
<style>
  :root {
    --cream: #fff6ed;
    --border-rest: #f6bc86;
    --border-focus: #fe8f4d;
    --card-border: #e3e3e3;
    --ink: #222222;
    --muted: #8a8577;
    --success: #1e7e34;
    --error: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: #fffff6;
    color: var(--ink);
  }

  /* LOGIN — foto à esquerda + cartão flutuante à direita */
  .login-layout { min-height: 100vh; display: flex; }
  .photo-panel {
    flex: 1;
    background: #d9d3c7 url('foto-acipol.jpg') center/cover no-repeat;
    border-radius: 0 48px 48px 0;
  }
  .login-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .card {
    width: 100%;
    max-width: 330px;
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.04);
  }
  .emblem {
    width: 72px; height: 72px; margin: 0 auto 3px; display: block; overflow: hidden; border-radius: 50%;
  }
  .emblem img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; text-align: center; margin: 0 0 2px; }
  .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  .field { margin-bottom: 16px; }
  label { font-size: 13px; display: block; margin-bottom: 5px; }
  input[type=text], input[type=password] {
    width: 100%; height: 36px; padding: 0 14px; border-radius: 15px;
    border: 1px solid var(--border-rest); background: var(--cream);
    font-size: 14px; color: var(--ink); transition: border-color .15s ease;
  }
  input:focus { outline: none; border: 2px solid var(--border-focus); }
  input.filled { background: #ececec; border: 1px solid #c9c9c9; }
  input.filled:focus { background: var(--cream); border: 2px solid var(--border-focus); }
  .field-error { font-size: 12px; color: var(--error); margin-top: 4px; display: none; }
  .field.invalid input { border: 2px solid var(--error); }
  .field.invalid .field-error { display: block; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .field.shake { animation: shake 0.4s; }

  button.primary {
    width: 100%; height: 35px; background: #ffffff; color: var(--ink);
    border: 1.5px solid var(--border-focus); border-radius: 19px;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s ease;
  }
  button.primary:hover { background: var(--cream); }
  #login-msg { font-size: 13px; color: var(--error); min-height: 16px; margin-bottom: 8px; text-align: center; }

  /* DASHBOARD */
  #dashboard { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 13px; }
  .topbar button {
    background: #ffffff; border: 1px solid var(--card-border); border-radius: 10px;
    padding: 7px 14px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .topbar button:hover { border-color: var(--border-focus); color: var(--ink); }
  .row-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .badge { background: var(--cream); border: 1px solid var(--border-rest); color: #a5652a; font-size: 13px; font-weight: 600; padding: 6px 16px; border-radius: 10px; }
  .counter { background: #ffffff; border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 18px; text-align: center; }
  .counter .lbl { font-size: 12px; color: var(--muted); }
  .counter .val { font-size: 22px; font-weight: 700; }

  .search-box { margin-bottom: 12px; }
  .search-box input {
    width: 100%; height: 42px; padding: 0 14px; border-radius: 14px;
    border: 1px solid var(--border-rest); background: var(--cream);
    font-size: 14px; color: var(--ink);
  }
  .search-box input:focus { outline: none; border: 1px solid var(--border-focus); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { border: 1px solid var(--card-border); padding: 9px 6px; text-align: center; }
  th { font-weight: 600; background: #fafafa; }
  th.active, td.active { background: var(--cream); }
  .nome-col { text-align: left; }
  td.clickable { cursor: pointer; }
  td.clickable:hover { background: #fdeee0; }
  .ok-icon { color: var(--success); font-weight: 700; }
  .x-icon { color: var(--error); font-weight: 700; }
  .empty-icon { color: var(--muted); }
  .revert { color: var(--muted); cursor: pointer; margin-left: 4px; font-size: 11px; text-decoration: underline; }

  #admin-panel { margin-top: 22px; border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; background: #ffffff; }
  #admin-panel h3 { font-size: 14px; margin: 0 0 12px; font-family: 'Playfair Display', Georgia, serif; }
  .feriado-form { display: flex; gap: 8px; margin-bottom: 10px; }
  .feriado-form input[type=date] { height: 38px; border-radius: 10px; border: 1px solid var(--border-rest); background: var(--cream); padding: 0 10px; }
  .feriado-form input[type=text] { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--border-rest); background: var(--cream); padding: 0 10px; }
  .feriado-form button { background: #ffffff; border: 1.5px solid var(--border-focus); border-radius: 10px; padding: 0 16px; font-size: 13px; cursor: pointer; }
  .feriado-form button:hover { background: var(--cream); }
  ul#feriado-lista { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  ul#feriado-lista li { padding: 7px 0; border-top: 1px solid var(--card-border); }
  ul#feriado-lista li:first-child { border-top: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

  #msg-ok { font-size: 13px; color: var(--success); min-height: 16px; text-align: center; margin-bottom: 10px; }
  #msg-ok.erro { color: var(--error); }
  mark { background: var(--border-rest); color: inherit; padding: 0 1px; border-radius: 3px; }

  @media (max-width: 760px) {
    .photo-panel { display: none; }
  }
</style>
</head>
<body>

<div class="login-layout" id="login-screen">
  <div class="photo-panel"></div>
  <div class="login-panel">
    <div class="card">
      <div class="emblem"><img src="favicon.png" alt="Emblema ACIPOL" /></div>
      <h1>ACIPOL</h1>
      <h1>Painel do Refeitório</h1>
      
      <div id="login-msg"></div>

      <div class="field" id="field-username">
        <label for="username">Utilizador</label>
        <input type="text" id="username" placeholder="seu utilizador aqui" autocomplete="username" />
        <div class="field-error">Escreva o utilizador.</div>
      </div>
      <div class="field" id="field-password">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="sua senha aqui" autocomplete="current-password" />
        <div class="field-error">Escreva a senha.</div>
      </div>
      <button class="primary" id="btnLogin">Entrar</button>
    </div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div>NOME: <b id="userLabel"></b></div>
    <div style="display:flex; gap:8px;">
      <button id="btnPrint" style="display:none;">Baixar PDF</button>
      <button id="btnLogout">Sair</button>
    </div>
  </div>

  <div class="row-info">
    <span class="badge" id="dataBadge">—</span>
    <div class="counter">
      <div class="lbl" id="counterLabel">Restam</div>
      <div class="val" id="counterValue">—</div>
      <div class="lbl" id="counterLabel1">Cadetes</div>
    </div>
  </div>

  <div id="msg-ok"></div>

  <div class="search-box">
    <input type="text" id="buscaInput" placeholder="Pesquisa por nome / nuri..." />
  </div>

  <div id="tabelaCozinha" style="overflow-x:auto; border-radius:12px; border:1px solid var(--card-border);">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="chefe-view" style="display:none; overflow-x:auto; border-radius:12px; border:1px solid var(--card-border);">
    <table>
      <thead id="chefeHead"></thead>
      <tbody id="chefeBody"></tbody>
    </table>
  </div>

  <div id="admin-panel" style="display:none;">
    <h3>Feriados (admin)</h3>
    <div class="feriado-form">
      <input type="date" id="feriadoData" />
      <input type="text" id="feriadoNome" placeholder="Nome do feriado" />
      <button id="btnAddFeriado">Adicionar</button>
    </div>
    <ul id="feriado-lista"></ul>
    <div class="hint">Os feriados de segunda a sexta ativam as refeições automaticamente.</div>
  </div>
</div>

<script src="painel.js"></script>
</body>
</html>
