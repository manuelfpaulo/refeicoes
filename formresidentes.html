<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inscrição — Refeições do Fim de Semana</title>
<style>
  :root {
    --bg: #f7f4ef;
    --ink: #1a1a2e;
    --accent: #c0392b;
    --gold: #d4a030;
    --border: #e2ddd2;
    --muted: #8a8577;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    text-align: center;
    margin: 0 0 2px;
  }
  .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .status {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .status.aberto { background: #e6f4ea; color: #1e7e34; }
  .status.fechado { background: #f1efe9; color: var(--muted); }
  label { font-size: 13px; color: var(--ink); display: block; margin-bottom: 4px; }
  input[type=text] {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    height: 44px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #msg { font-size: 13px; min-height: 18px; margin: 10px 0; text-align: center; }
  #msg.ok { color: #1e7e34; }
  #msg.erro { color: var(--accent); }
  .list-title { font-size: 13px; font-weight: 600; margin: 22px 0 8px; display: flex; justify-content: space-between; }
  ul#lista { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  ul#lista li { padding: 9px 12px; font-size: 13px; border-top: 1px solid var(--border); }
  ul#lista li:first-child { border-top: none; }
  .empty { text-align: center; color: var(--muted); padding: 14px; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Inscrição — Refeições do Fim de Semana</h1>
    <div class="sub">Cadetes residentes na ACIPOL</div>

    <div id="status" class="status">A verificar...</div>

    <form id="form">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Ex: Manuel Félix Paulo" autocomplete="off" />

      <label for="matricula">Número de matrícula</label>
      <input type="text" id="matricula" placeholder="Ex: AC2303" autocomplete="off" />

      <button type="submit" id="btnEnviar">Inscrever</button>
    </form>
    <div id="msg"></div>

    <div class="list-title">
      <span>Já inscritos neste período</span>
      <span id="contagem">0 cadetes</span>
    </div>
    <ul id="lista"></ul>
  </div>

<script>
  // >>> Cole aqui o URL da implantação do Apps Script (Web App) <<<
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4zTaR0zxbzubBIWCP21FRjBvby4CPK8CdS5ewglIMPfgA2VE0nKKcXB4tv1YKo0ja/exec";

  var formAberto = false;

  function carregarStatus() {
    fetch(SCRIPT_URL + "?accao=statusFormulario")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        formAberto = !!data.aberto;
        var statusEl = document.getElementById("status");
        var btn = document.getElementById("btnEnviar");
        if (formAberto) {
          statusEl.textContent = "Inscrições abertas até quinta-feira, 21:00";
          statusEl.className = "status aberto";
          btn.disabled = false;
        } else {
          statusEl.textContent = "Inscrições fechadas — abrem novamente na segunda-feira";
          statusEl.className = "status fechado";
          btn.disabled = true;
        }
        renderLista(data.inscritos || []);
      })
      .catch(function () {
        document.getElementById("status").textContent = "Não foi possível ligar ao servidor.";
      });
  }

  function renderLista(inscritos) {
    document.getElementById("contagem").textContent = inscritos.length + " cadetes";
    var ul = document.getElementById("lista");
    if (inscritos.length === 0) {
      ul.innerHTML = '<li class="empty">Ainda ninguém se inscreveu.</li>';
      return;
    }
    ul.innerHTML = inscritos.map(function (ins, i) {
      return "<li>" + (i + 1) + ". " + ins.nome + "</li>";
    }).join("");
  }

  function mostrarMsg(texto, ok) {
    var msg = document.getElementById("msg");
    msg.textContent = texto;
    msg.className = ok ? "ok" : "erro";
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!formAberto) return;
    var nome = document.getElementById("nome").value.trim();
    var matricula = document.getElementById("matricula").value.trim();
    if (!nome || !matricula) {
      mostrarMsg("Preencha nome e matrícula.", false);
      return;
    }
    var btn = document.getElementById("btnEnviar");
    btn.disabled = true;

    var body = new URLSearchParams();
    body.append("accao", "inscrever");
    body.append("nome", nome);
    body.append("matricula", matricula);

    fetch(SCRIPT_URL, { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (data.ok) {
          mostrarMsg("Inscrição registada com sucesso.", true);
          document.getElementById("nome").value = "";
          document.getElementById("matricula").value = "";
          carregarStatus();
        } else {
          mostrarMsg(data.erro || "Não foi possível inscrever.", false);
        }
      })
      .catch(function () {
        btn.disabled = false;
        mostrarMsg("Erro de ligação. Tente novamente.", false);
      });
  });

  carregarStatus();
  setInterval(carregarStatus, 10000); // atualiza sozinho a cada 10 segundos
</script>
</body>
</html>
